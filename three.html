<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三维展示 - 校园公交</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">🚌 校园公交信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="route.html">路线详情</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">数据统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three.html">三维展示</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="mb-4">
      <h1 class="h3">校园公交三维路线展示</h1>
      <p class="text-muted">Three.js 渲染校园公交运行场景 · 鼠标拖拽旋转 · 滚轮缩放 · 右键平移</p>
    </header>

    <div class="card mb-3">
      <div class="card-body">
        <div id="three-canvas"></div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-primary">🚌 公交车</h5>
            <p class="card-text small">蓝色方块代表楠苑环线公交，沿站点移动。绿色代表梓苑通勤线，红色代表北门南门直达线。</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-success">📍 站点</h5>
            <p class="card-text small">球体标记各站点位置，不同颜色对应不同路线。点击站点可查看名称。</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-danger">🗺️ 路线</h5>
            <p class="card-text small">虚线连接各站点形成路线。公交车沿路线循环移动，模拟实时运行。</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="container text-center text-muted small py-4">
    <p>云南大学信息学院 · 软件开发综合实践期末大作业 · 2026.9</p>
  </footer>

  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="js/three.js"></script>
</body>
</html>
