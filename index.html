<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园公交实时信息中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">🚌 校园公交信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="route.html">路线详情</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">数据统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three.html">三维展示</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <p id="status" class="alert alert-warning">
      <span id="status-text"></span>
      <button id="retry-btn" class="btn btn-sm btn-primary ms-2" style="display:none;">重试</button>
    </p>

    <header class="mb-4">
      <h1 class="h3">校园公交实时到站信息</h1>
      <p class="text-muted" id="sub-title">云南大学呈贡校区 · 校园公交实时数据</p>
      <p class="text-muted small" id="source-note">数据来源：模拟实时数据（教学演示）</p>
    </header>

    <section class="row g-3 mb-4" id="route-cards">
      <div class="col-12 text-center text-muted py-4">加载中...</div>
    </section>

    <section class="row g-3 mb-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-primary">📌 使用说明</h5>
            <p class="card-text small">点击上方路线卡片查看详细站点信息和票价。倒计时每5秒自动刷新。</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-success">💡 出行建议</h5>
            <p class="card-text small">早高峰（7:00-9:00）建议提前10分钟到站。拥挤度高于80%时建议等候下一班。</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title text-danger">⚠️ 注意事项</h5>
            <p class="card-text small">数据为模拟演示数据，非真实运营数据。实际乘车请以校园公交实际情况为准。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="container text-center text-muted small py-4">
    <p>云南大学信息学院 · 软件开发综合实践期末大作业 · 2026.9</p>
  </footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
